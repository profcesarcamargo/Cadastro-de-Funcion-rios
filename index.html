<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Cadastro de Funcionários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Tailwind é apenas para desenvolvimento - OK para protótipo */
        body {
            background-image: url('Imagem1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }
        
        .min-h-screen {
            position: relative;
            z-index: 1;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 glass-card">
            <div class="flex justify-center mb-4">
                <div class="bg-blue-100 rounded-full p-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-center text-gray-800">Sistema de Cadastro</h2>
            <p class="text-center text-sm text-gray-500 mb-6">Prefeitura de Santa Branca</p>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2 font-medium">E-mail</label>
                    <input type="email" id="email" required 
                           class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2 font-medium">Senha</label>
                    <input type="password" id="senha" required 
                           class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                
                <button type="submit" 
                        class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition font-semibold">
                    Entrar
                </button>
            </form>
            
            <div id="mensagemErro" class="mt-4 text-red-500 text-center hidden text-sm"></div>
            
            <p class="mt-6 text-center text-sm text-gray-600">
                Não tem conta? <a href="#" id="btnCadastro" class="text-blue-600 font-semibold">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modalCadastro" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-96 p-6">
            <h3 class="text-xl font-bold mb-4">Criar Nova Conta</h3>
            <form id="formCadastro">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">Nome</label>
                    <input type="text" id="nomeCadastro" required class="w-full border p-2 rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="emailCadastro" required class="w-full border p-2 rounded-lg">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-1">Senha</label>
                    <input type="password" id="senhaCadastro" required class="w-full border p-2 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-lg hover:bg-green-700">Cadastrar</button>
                <button type="button" id="fecharModal" class="w-full mt-2 bg-gray-300 p-2 rounded-lg">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        // Configuração do Supabase - declarado apenas UMA vez
        const SUPABASE_URL = 'https://ndvgduxdebeiyujfrups.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kdmdkdXhkZWJlaXl1amZydXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NzM4MzgsImV4cCI6MjA5MzQ0OTgzOH0.G7fWT-Ys6RLif0ce8zuHbjqbDUm6jOd8oxa9dSjPtg8';
        
        // Cria o cliente Supabase apenas uma vez
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Função para verificar se já está logado
        async function verificarSessao() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                console.log('Usuário já logado, redirecionando...');
                window.location.href = 'sistema.html';
            }
        }
        
        // Evento de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btnSubmit = e.target.querySelector('button');
            const textoOriginal = btnSubmit.textContent;
            
            btnSubmit.textContent = 'Entrando...';
            btnSubmit.disabled = true;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: senha
            });
            
            btnSubmit.textContent = textoOriginal;
            btnSubmit.disabled = false;
            
            if (error) {
                const msgErro = document.getElementById('mensagemErro');
                msgErro.textContent = '❌ E-mail ou senha inválidos';
                msgErro.classList.remove('hidden');
                setTimeout(() => msgErro.classList.add('hidden'), 3000);
                console.error('Erro de login:', error.message);
            } else {
                console.log('Login bem-sucedido, redirecionando...');
                window.location.href = 'sistema.html';
            }
        });

        // Modal de cadastro
        const modal = document.getElementById('modalCadastro');
        document.getElementById('btnCadastro').addEventListener('click', (e) => {
            e.preventDefault();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });
        
        document.getElementById('fecharModal').addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        // Evento de cadastro
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('emailCadastro').value;
            const senha = document.getElementById('senhaCadastro').value;
            const nome = document.getElementById('nomeCadastro').value;
            
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: senha,
                options: { data: { name: nome } }
            });
            
            if (error) {
                alert('❌ Erro ao criar conta: ' + error.message);
            } else {
                alert('✅ Conta criada com sucesso! Faça login.');
                modal.classList.add('hidden');
                document.getElementById('formCadastro').reset();
                // Preenche o email no formulário de login
                document.getElementById('email').value = email;
            }
        });
        
        // Verifica sessão ao carregar a página
        verificarSessao();
    </script>
</body>
</html>
