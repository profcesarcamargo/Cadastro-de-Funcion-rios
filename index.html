<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Funcionários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Sistema de Cadastro de Funcionários</h2>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">E-mail</label>
                    <input type="email" id="email" required 
                           class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">Senha</label>
                    <input type="password" id="senha" required 
                           class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
                </div>
                
                <button type="submit" 
                        class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">
                    Entrar
                </button>
            </form>
            
            <div id="mensagemErro" class="mt-4 text-red-500 text-center hidden"></div>
            
            <p class="mt-4 text-center text-sm text-gray-600">
                Não tem conta? <a href="#" id="btnCadastro" class="text-blue-500">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modalCadastro" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h3 class="text-xl font-bold mb-4">Criar Nova Conta</h3>
            <form id="formCadastro">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nome</label>
                    <input type="text" id="nomeCadastro" required class="w-full border p-2 rounded">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">E-mail</label>
                    <input type="email" id="emailCadastro" required class="w-full border p-2 rounded">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Senha</label>
                    <input type="password" id="senhaCadastro" required class="w-full border p-2 rounded">
                </div>
                <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">
                    Cadastrar
                </button>
                <button type="button" id="fecharModal" class="w-full mt-2 bg-gray-300 p-2 rounded">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ndvgduxdebeiyujfrups.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kdmdkdXhkZWJlaXl1amZydXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NzM4MzgsImV4cCI6MjA5MzQ0OTgzOH0.G7fWT-Ys6RLif0ce8zuHbjqbDUm6jOd8oxa9dSjPtg8';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function verificarSessao() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'sistema.html';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: senha
            });
            
            if (error) {
                const msgErro = document.getElementById('mensagemErro');
                msgErro.textContent = '❌ E-mail ou senha inválidos';
                msgErro.classList.remove('hidden');
            } else {
                window.location.href = 'sistema.html';
            }
        });

        const modal = document.getElementById('modalCadastro');
        document.getElementById('btnCadastro').addEventListener('click', () => {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });
        
        document.getElementById('fecharModal').addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('emailCadastro').value;
            const senha = document.getElementById('senhaCadastro').value;
            const nome = document.getElementById('nomeCadastro').value;
            
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: senha,
                options: { data: { name: nome } }
            });
            
            if (error) {
                alert('❌ Erro ao criar conta: ' + error.message);
            } else {
                alert('✅ Conta criada com sucesso! Faça login.');
                modal.classList.add('hidden');
                document.getElementById('formCadastro').reset();
            }
        });
        
        verificarSessao();
    </script>
</body>
</html>
