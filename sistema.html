<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Funcionários - Secretaria Municipal de Educação de Santa Branca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .foto-miniatura {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }
        .foto-perfil {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #3b82f6;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-white shadow-lg sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-100 rounded-full p-2">
                        <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold text-gray-800">Sistema de Cadastro de Funcionários</h1>
                    <span class="text-sm text-gray-500">Secretaria Municipal de Educação de Santa Branca</span>
                </div>
                <button id="btnLogout" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm">
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-800">Funcionários Cadastrados</h2>
            <button id="btnAdicionar" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 transition">
                + Novo Funcionário
            </button>
        </div>

        <!-- Área de diagnóstico -->
        <div id="diagnostico" class="mb-4 p-3 bg-blue-100 border border-blue-400 rounded-lg text-sm hidden"></div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Foto</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nome</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cargo</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">E-mail</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Telefone</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaFuncionarios">
                        <tr>
                            <td colspan="6" class="text-center py-8">
                                <div class="loading"></div>
                                <span class="ml-2">Carregando funcionários...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Cadastro/Edição -->
    <div id="modalFuncionario" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <h3 id="modalTitle" class="text-xl font-bold mb-4">Cadastrar Funcionário</h3>
                <form id="formFuncionario">
                    <input type="hidden" id="funcionarioId">
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1 font-medium">Nome Completo *</label>
                        <input type="text" id="nomeFunc" required class="w-full border border-gray-300 p-2 rounded-lg">
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1 font-medium">Cargo *</label>
                        <input type="text" id="cargoFunc" required class="w-full border border-gray-300 p-2 rounded-lg">
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1 font-medium">E-mail *</label>
                        <input type="email" id="emailFunc" required class="w-full border border-gray-300 p-2 rounded-lg">
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1 font-medium">Telefone</label>
                        <input type="text" id="telefoneFunc" class="w-full border border-gray-300 p-2 rounded-lg" placeholder="(00) 00000-0000">
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1 font-medium">Link da Foto</label>
                        <input type="text" id="fotoUrlFunc" class="w-full border border-gray-300 p-2 rounded-lg" placeholder="https://exemplo.com/foto.jpg">
                        <div class="mt-2 flex justify-center">
                            <img id="previewImg" class="w-16 h-16 rounded-full object-cover hidden">
                        </div>
                    </div>
                    
                    <div class="flex gap-3 mt-5">
                        <button type="submit" class="flex-1 bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700">Salvar</button>
                        <button type="button" id="fecharModalFunc" class="flex-1 bg-gray-300 p-2 rounded-lg hover:bg-gray-400">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Visualizar Ficha -->
    <div id="modalFicha" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Ficha do Funcionário</h3>
                    <button id="fecharFicha" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                </div>
                <div id="conteudoFicha" class="text-center">
                    <!-- Conteúdo dinâmico -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ndvgduxdebeiyujfrups.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kdmdkdXhkZWJlaXl1amZydXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NzM4MzgsImV4cCI6MjA5MzQ0OTgzOH0.G7fWT-Ys6RLif0ce8zuHbjqbDUm6jOd8oxa9dSjPtg8';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Verificar sessão
        async function verificarSessao() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            console.log('✅ Usuário logado:', session.user.email);
            carregarFuncionarios();
        }

        // Carregar funcionários da tabela tblCadastro
        async function carregarFuncionarios() {
            console.log('🔄 Carregando funcionários da tabela tblCadastro...');
            
            const { data, error, status, statusText } = await supabase
                .from('tblCadastro')
                .select('*')
                .order('id', { ascending: false });
            
            console.log('📊 Resposta do Supabase:', { data, error, status, statusText });
            
            if (error) {
                console.error('❌ ERRO detalhado:', error);
                document.getElementById('tabelaFuncionarios').innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-8 text-red-500">
                            ❌ Erro: ${error.message}<br>
                            <span class="text-xs">Verifique o console do navegador (F12)</span>
                        </td>
                    </tr>
                `;
                return;
            }
            
            if (!data || data.length === 0) {
                console.log('ℹ️ Nenhum funcionário encontrado na tabela tblCadastro');
                document.getElementById('tabelaFuncionarios').innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-8 text-gray-500">
                            📋 Nenhum funcionário cadastrado.<br>
                            Clique em "Novo Funcionário" para adicionar.
                        </td>
                    </tr>
                `;
                return;
            }
            
            console.log(`✅ ${data.length} funcionários carregados!`);
            console.log('📋 Primeiro funcionário (para ver estrutura):', data[0]);
            
            // Mostrar diagnóstico com as colunas disponíveis
            const colunas = Object.keys(data[0]);
            document.getElementById('diagnostico').innerHTML = `
                <strong>🔍 Diagnóstico:</strong> Tabela "tblCadastro" tem ${data.length} registros.<br>
                <strong>Colunas encontradas:</strong> ${colunas.join(', ')}
            `;
            document.getElementById('diagnostico').classList.remove('hidden');
            
            renderizarTabela(data);
        }

        // Renderizar tabela (adaptado às colunas reais da sua tabela)
        function renderizarTabela(funcionarios) {
            const tbody = document.getElementById('tabelaFuncionarios');
            tbody.innerHTML = '';
            
            funcionarios.forEach(func => {
                // Mapeamento flexível de colunas
                const nome = func.nome || func.NOME || func.name || func.Nome || '-';
                const cargo = func.cargo || func.CARGO || func.Cargo || '-';
                const email = func.email || func.EMAIL || func.Email || '-';
                const telefone = func.telefone || func.TELEFONE || func.Telefone || func.phone || '-';
                const foto = func.Foto || func.foto || func.FOTO || func.foto_url || null;
                
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td class="px-4 py-3">
                        <img src="${foto || 'https://via.placeholder.com/40?text=Sem+Foto'}" 
                             class="foto-miniatura"
                             onerror="this.src='https://via.placeholder.com/40?text=Erro'">
                    </td>
                    <td class="px-4 py-3 font-medium text-gray-900">${nome}</td>
                    <td class="px-4 py-3 text-gray-600">${cargo}</td>
                    <td class="px-4 py-3 text-gray-600">${email}</td>
                    <td class="px-4 py-3 text-gray-600">${telefone}</td>
                    <td class="px-4 py-3">
                        <div class="flex gap-2">
                            <button onclick="verFicha('${func.id}')" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-blue-600">
                                Ver
                            </button>
                            <button onclick="editarFuncionario('${func.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-yellow-600">
                                Editar
                            </button>
                            <button onclick="excluirFuncionario('${func.id}')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-600">
                                Excluir
                            </button>
                        </div>
                    </td>
                `;
            });
        }

        // Ver ficha do funcionário
        window.verFicha = async function(id) {
            const { data, error } = await supabase
                .from('tblCadastro')
                .select('*')
                .eq('id', id)
                .single();
            
            if (error) {
                alert('Erro ao carregar ficha: ' + error.message);
                return;
            }
            
            const nome = data.nome || data.NOME || '-';
            const cargo = data.cargo || data.CARGO || '-';
            const email = data.email || data.EMAIL || '-';
            const telefone = data.telefone || data.TELEFONE || '-';
            const foto = data.Foto || data.foto || null;
            
            document.getElementById('conteudoFicha').innerHTML = `
                <div class="flex flex-col items-center">
                    <img src="${foto || 'https://via.placeholder.com/100?text=Sem+Foto'}" 
                         class="foto-perfil mb-3"
                         onerror="this.src='https://via.placeholder.com/100?text=Erro'">
                    <h2 class="text-lg font-bold">${nome}</h2>
                    <p class="text-blue-600 font-semibold">${cargo}</p>
                    <hr class="my-3 w-full">
                    <div class="w-full text-left">
                        <p><strong>📧 E-mail:</strong> ${email}</p>
                        <p><strong>📞 Telefone:</strong> ${telefone}</p>
                    </div>
                </div>
            `;
            
            document.getElementById('modalFicha').classList.remove('hidden');
            document.getElementById('modalFicha').classList.add('flex');
        };

        // Editar funcionário
        window.editarFuncionario = async function(id) {
            const { data, error } = await supabase
                .from('tblCadastro')
                .select('*')
                .eq('id', id)
                .single();
            
            if (error) {
                alert('Erro ao carregar dados: ' + error.message);
                return;
            }
            
            document.getElementById('modalTitle').textContent = 'Editar Funcionário';
            document.getElementById('funcionarioId').value = data.id;
            document.getElementById('nomeFunc').value = data.nome || '';
            document.getElementById('cargoFunc').value = data.cargo || '';
            document.getElementById('emailFunc').value = data.email || '';
            document.getElementById('telefoneFunc').value = data.telefone || '';
            document.getElementById('fotoUrlFunc').value = data.Foto || data.foto || '';
            
            if (data.Foto || data.foto) {
                document.getElementById('previewImg').src = data.Foto || data.foto;
                document.getElementById('previewImg').classList.remove('hidden');
            } else {
                document.getElementById('previewImg').classList.add('hidden');
            }
            
            document.getElementById('modalFuncionario').classList.remove('hidden');
            document.getElementById('modalFuncionario').classList.add('flex');
        };

        // Excluir funcionário
        window.excluirFuncionario = async function(id) {
            if (confirm('Tem certeza que deseja excluir este funcionário?')) {
                const { error } = await supabase
                    .from('tblCadastro')
                    .delete()
                    .eq('id', id);
                
                if (error) {
                    alert('Erro ao excluir: ' + error.message);
                } else {
                    alert('Funcionário excluído!');
                    carregarFuncionarios();
                }
            }
        };

        // Salvar funcionário
        document.getElementById('formFuncionario').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('funcionarioId').value;
            const dados = {
                nome: document.getElementById('nomeFunc').value,
                cargo: document.getElementById('cargoFunc').value,
                email: document.getElementById('emailFunc').value,
                telefone: document.getElementById('telefoneFunc').value,
                Foto: document.getElementById('fotoUrlFunc').value || null
            };
            
            console.log('💾 Salvando dados:', dados);
            
            let result;
            if (id) {
                result = await supabase
                    .from('tblCadastro')
                    .update(dados)
                    .eq('id', id);
            } else {
                result = await supabase
                    .from('tblCadastro')
                    .insert([dados]);
            }
            
            if (result.error) {
                console.error('❌ Erro ao salvar:', result.error);
                alert('Erro ao salvar: ' + result.error.message);
            } else {
                console.log('✅ Salvo com sucesso!');
                alert(id ? 'Funcionário atualizado!' : 'Funcionário cadastrado!');
                fecharModalFuncionario();
                carregarFuncionarios();
            }
        });

        // Preview da foto
        document.getElementById('fotoUrlFunc').addEventListener('input', (e) => {
            const url = e.target.value;
            if (url && url.startsWith('http')) {
                document.getElementById('previewImg').src = url;
                document.getElementById('previewImg').classList.remove('hidden');
            } else {
                document.getElementById('previewImg').classList.add('hidden');
            }
        });

        // Fechar modal
        function fecharModalFuncionario() {
            document.getElementById('modalFuncionario').classList.add('hidden');
            document.getElementById('modalFuncionario').classList.remove('flex');
            document.getElementById('formFuncionario').reset();
            document.getElementById('funcionarioId').value = '';
            document.getElementById('modalTitle').textContent = 'Cadastrar Funcionário';
            document.getElementById('previewImg').classList.add('hidden');
        }

        document.getElementById('btnAdicionar').addEventListener('click', () => {
            fecharModalFuncionario();
            document.getElementById('modalFuncionario').classList.remove('hidden');
            document.getElementById('modalFuncionario').classList.add('flex');
        });

        document.getElementById('fecharModalFunc').addEventListener('click', fecharModalFuncionario);
        document.getElementById('fecharFicha').addEventListener('click', () => {
            document.getElementById('modalFicha').classList.add('hidden');
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        // Fechar modais clicando fora
        document.getElementById('modalFuncionario').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalFuncionario')) fecharModalFuncionario();
        });
        document.getElementById('modalFicha').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalFicha')) {
                document.getElementById('modalFicha').classList.add('hidden');
            }
        });

        verificarSessao();
    </script>
</body>
</html>
